# Flow 24: Entry1 — tool card view (Read/Write/Edit → FileViewer snapshot)
appId: dev.leonardo.ocbeacon.dev
---
# Prerequisite: chat must have Read/Write/Edit tool cards (requires AI interaction)
# Navigate to chat inline (independent of chat-flow runFlow ending state)
- launchApp

# Dismiss any lingering Add Server dialog (state pollution guard)
- tapOn:
    text: "Cancel"
    optional: true

- tapOn:
    text: "Start Connect|Connect"
    optional: true
- extendedWaitUntil:
    visible: "Connected"
    timeout: 20000
    optional: true
- tapOn:
    text: "Sessions"
    index: 0
    optional: true
- extendedWaitUntil:
    visible: "Search sessions..."
    timeout: 10000
    optional: true
- tapOn: "D:/Develop/code/app/oc-beacon"
- tapOn: "系统问题分析与修复方案"
- extendedWaitUntil:
    visible: "More options"
    timeout: 15000
    optional: true

# Send a message that triggers a tool call (plain "say hi" produces no tool card).
# NOTE: maestro does not support Unicode input — use ASCII. Input field auto-focuses
# after opening the chat, so no tapOn needed.
- inputText: "Read the AGENTS.md file"
- pressKey: ENTER

# Wait for the tool card open-file button — the ONLY reliable card signal.
# NOTE: do NOT wait for "Read"/"Edit" text — the user message "Read the AGENTS.md file"
# itself matches it (false positive). The button (resource-id tool_card_open_file) is an
# icon with contentDescription only (textRegex cannot match it) and only shows after the
# AI tool call completes (hidden while isRunning). AI response can take minutes under load.
- extendedWaitUntil:
    visible:
      id: "tool_card_open_file"
    timeout: 300000
    optional: true

# Tap the open-file button on the first tool card
- tapOn:
    id: "tool_card_open_file"
    index: 0
    optional: true
- extendedWaitUntil:
    visible: ".*"
    timeout: 10000
    optional: true
- takeScreenshot: e2e_entry1_snapshot_view

# Back to chat
- tapOn:
    text: "Back"
