# Flow 22: Workspace file search (file tree + git changes)
appId: dev.leonardo.ocbeacon.dev
---
# Navigate to chat (inline; independent of chat-flow runFlow ending state)
- launchApp

- tapOn:
    text: "Start Connect|Connect"
    optional: true
- extendedWaitUntil:
    visible: "Connected"
    timeout: 20000
    optional: true
- tapOn:
    text: "Sessions"
    index: 0
    optional: true
- extendedWaitUntil:
    visible: "Search sessions..."
    timeout: 10000
    optional: true
- tapOn: "D:/Develop/code/app/oc-beacon"
- tapOn: "System issue analysis"
- extendedWaitUntil:
    visible: "More options"
    timeout: 15000
    optional: true

# Open workspace
- tapOn:
    id: "more_vert"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "View Workspace"

# File tree search
- tapOn:
    id: "workspace_search_button"
- tapOn:
    id: "workspace_search_input"
- inputText: "Workspace"
- extendedWaitUntil:
    visible: ".*Workspace.*"
    timeout: 8000
    optional: true
- takeScreenshot: e2e_search_file_results
- tapOn:
    id: "workspace_search_result"
    index: 0
- extendedWaitUntil:
    visible: ".*"
    timeout: 5000
    optional: true
- takeScreenshot: e2e_search_opened_file

# Back to workspace
- tapOn:
    text: "Back"
- tapOn:
    text: "Back"

# Git changes search
- tapOn:
    id: "more_vert"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "View Workspace"
- tapOn:
    id: "panel_toggle"
- tapOn:
    id: "workspace_search_button"
- tapOn:
    id: "workspace_search_input"
- inputText: ".kt"
- takeScreenshot: e2e_search_git_filter
- tapOn:
    id: "workspace_search_clear"
- takeScreenshot: e2e_search_cleared
