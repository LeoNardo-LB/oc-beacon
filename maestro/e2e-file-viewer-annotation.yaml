appId: dev.leonardo.ocbeacon.dev
name: E2E - File Viewer Annotation (Real OpenCode Server)
tags:
  - e2e
  - workspace
  - annotation
---

# Prerequisite: Server at 10.0.2.2:4096, session active, workspace accessible

- launchApp

# Connect if not already connected (app does not auto-connect after cold start)
- tapOn:
    text: "Connect"
    optional: true

- extendedWaitUntil:
    visible: "Connected"
    timeout: 20000
    optional: true

# Navigate to a session
- tapOn:
    text: "Sessions"
    index: 0
- extendedWaitUntil:
    visible: "Search sessions..."
    timeout: 20000
    optional: true
- tapOn: "D:/Develop/code/app/oc-beacon"
- extendedWaitUntil:
    visible: "sessions active"
    timeout: 15000
    optional: true
- tapOn: "系统问题分析与修复方案"
- extendedWaitUntil:
    visible: "More options"
    timeout: 20000
    optional: true

# Open workspace
- tapOn:
    id: "more_vert"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "View Workspace"

# Switch to Git changes panel (annotation requires the diff → source path)
- tapOn:
    id: "panel_toggle"
- waitForAnimationToEnd:
    timeout: 3000

# Open a changed source file (diff view)
# NOTE: requires an uncommitted change in the working tree (list is dynamic);
# row text includes "M <path> +N -M" so match with regex
- tapOn: ".*e2e-file-viewer-annotation.*"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: e2e_ann_diff_opened

# Switch to source view (CodeWebView with annotation bridge)
- tapOn:
    text: "Source"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: e2e_ann_source_opened

# Long-press code text in WebView to trigger text selection.
# WebView inner DOM is NOT exposed to accessibility — use coordinates on the code area.
- longPressOn:
    point: 50%,40%
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: e2e_ann_selection_started

# Tap "Annotate" in the selection action mode (native ActionMode is accessibility-visible)
- tapOn:
    text: "Annotate"
- takeScreenshot: e2e_ann_input_sheet

# Enter note (bottom sheet: testTags not exposed as resource-id, match label text)
- tapOn:
    text: "Modification note"
- inputText: "Test annotation note"
- tapOn:
    text: "Confirm"
- takeScreenshot: e2e_ann_added

# Verify annotation badge in TopBar
- assertVisible:
    text: ".*1.*"
    optional: true

# Tap submit (viewer dialog: match text)
- tapOn:
    text: "Submit"
- takeScreenshot: e2e_ann_submit_dialog

# Send (submit dialog: match text)
- tapOn:
    text: "Send"
- takeScreenshot: e2e_ann_submitted

# Verify toast (best-effort)
- extendedWaitUntil:
    visible: ".*Sent.*"
    timeout: 5000
    optional: true

# Verify navigation back to chat
- extendedWaitUntil:
    visible: "Ask a question"
    timeout: 10000
    optional: true
- takeScreenshot: e2e_ann_back_to_chat
