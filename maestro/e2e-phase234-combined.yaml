appId: dev.leonardo.ocbeacon.dev
name: E2E Phase 2-4 Combined
tags:
  - e2e
  - phase234
---
- launchApp

# Dismiss any lingering Add Server dialog (state pollution guard)
- tapOn:
    text: "Cancel"
    optional: true

# Wait for home — "Start Connect" (empty) / "Connect" (card) / "Open chat" (connected)
- extendedWaitUntil:
    visible: "Start Connect|Connect|Open chat|Connected"
    timeout: 30000
    optional: true

# Connect if needed
- tapOn:
    text: "Start Connect|Connect"
    index: 0
    optional: true

- extendedWaitUntil:
    visible: "Connected"
    timeout: 20000
    optional: true

# Open sessions (connected home shows "Open chat Sessions" button)
- tapOn:
    text: "Sessions"
    index: 0
    optional: true

- extendedWaitUntil:
    visible: "Search sessions..."
    timeout: 10000
    optional: true

# Open the workspace session
- tapOn:
    text: ".*oc-beacon.*"
    index: 0

- extendedWaitUntil:
    visible: "More options"
    timeout: 15000

# Open workspace
- tapOn:
    id: "more_vert"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: ".*Workspace.*"
    index: 0

- extendedWaitUntil:
    visible: "Refresh"
    timeout: 10000

- takeScreenshot: p234_01_workspace

# === Phase 2: Expand directories ===
- tapOn:
    text: "app"
    optional: true

- waitForAnimationToEnd:
    timeout: 3000

- tapOn:
    text: "src"
    optional: true

- waitForAnimationToEnd:
    timeout: 3000

- takeScreenshot: p234_02_tree_expanded

# === Phase 2: Open .md file ===
- tapOn:
    text: "Back"

- extendedWaitUntil:
    visible: "Refresh"
    timeout: 5000

- tapOn:
    text: "AGENTS.md"

- extendedWaitUntil:
    visible: ".*import.*"
    timeout: 8000
    optional: true

- takeScreenshot: p234_03_md_source

# === Phase 2: Markdown toggle ===
- tapOn:
    text: ".*[Pp]review.*"
    optional: true

- waitForAnimationToEnd:
    timeout: 3000

- takeScreenshot: p234_04_md_rendered

# === Phase 4: Scroll / pagination ===
- swipe:
    start: 50%, 80%
    end: 50%, 20%

- takeScreenshot: p234_05_md_scrolled

# Back to workspace (viewer Back has no resource-id; match text)
- tapOn:
    text: "Back"

# === Phase 4: Large file ===
- extendedWaitUntil:
    visible: "Refresh"
    timeout: 5000

- tapOn:
    text: "build.gradle.kts"

- extendedWaitUntil:
    visible: ".*"
    timeout: 5000
    optional: true

- takeScreenshot: p234_06_large_file

# Swipe for pagination
- swipe:
    start: 50%, 80%
    end: 50%, 20%

- takeScreenshot: p234_07_large_scrolled

# Done (viewer Back has no resource-id; match text)
- tapOn:
    text: "Back"
    optional: true

- takeScreenshot: p234_08_complete
