appId: dev.leonardo.ocbeacon.dev
name: E2E - Workspace File Tree (Real OpenCode Server)
tags:
  - e2e
  - workspace
  - file-tree
---

# E2E Workspace File Tree Flow
# Prerequisite: Server at 10.0.2.2:4096 connected

- launchApp

# Connect if not already connected (app does not auto-connect after cold start)
- tapOn:
    text: "Connect"
    optional: true

- extendedWaitUntil:
    visible: "Connected"
    timeout: 20000
    optional: true

- takeScreenshot: e2e_ws_home

# Navigate to Sessions
- tapOn:
    text: "Sessions"
    index: 0

- extendedWaitUntil:
    visible: "Search sessions..."
    timeout: 20000
    optional: true

- takeScreenshot: e2e_ws_sessions

# Tap on project directory
- tapOn: "D:/Develop/code/app/oc-beacon"

- extendedWaitUntil:
    visible: "sessions active"
    timeout: 15000
    optional: true

# Tap on a session
- tapOn: "System issue analysis"

- extendedWaitUntil:
    visible: "Ask a question"
    timeout: 20000
    optional: true

- takeScreenshot: e2e_ws_chat_ready

# Open workspace via overflow menu
- tapOn:
    id: "more_vert"
- waitForAnimationToEnd:
    timeout: 3000

- takeScreenshot: e2e_ws_menu_open

# Tap "View Workspace" menu item
- tapOn:
    text: "View Workspace"

# Wait for workspace screen
- extendedWaitUntil:
    visible: ".*"
    timeout: 10000

- takeScreenshot: e2e_ws_workspace_loaded

# File tree panel (default)

- takeScreenshot: e2e_ws_file_tree

# Tap a file
- tapOn: "AGENTS.md"

- takeScreenshot: e2e_ws_file_opened

# Back
- tapOn:
    text: "Back"
    optional: true
- back

- takeScreenshot: e2e_ws_back
