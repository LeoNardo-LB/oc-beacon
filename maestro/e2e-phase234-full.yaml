appId: dev.leonardo.ocbeacon.dev
name: E2E Phase 2-4 Full Journey
---
# Step 0: Launch app (fresh)
- killApp
- launchApp

# Wait for home — "Start Connect" (empty state) / "Connect" (server card) / "Open chat" (connected)
# killApp cold start can be slow on emulator — allow up to 30s
- extendedWaitUntil:
    visible: "Start Connect|Connect|Open chat|Connected"
    timeout: 30000
    optional: true

# Step 1: Connect to server (skip if already connected)
- tapOn:
    text: "Start Connect|Connect"
    optional: true

# Wait for connection to establish
- extendedWaitUntil:
    visible: "Connected"
    timeout: 20000
    optional: true

# Step 2: Open sessions
- tapOn:
    text: "Sessions"
    index: 0
    optional: true

- extendedWaitUntil:
    visible: "Search sessions..."
    timeout: 10000
    optional: true

# Step 3: Open workspace session (first match with oc-beacon)
- tapOn:
    text: ".*oc-beacon.*"
    index: 0

- extendedWaitUntil:
    visible: "More options"
    timeout: 15000
    optional: true

# Step 4: Open workspace
- tapOn:
    id: "more_vert"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: ".*Workspace.*"
    index: 0

- extendedWaitUntil:
    visible: "Refresh"
    timeout: 10000
    optional: true

# === Phase 2: File tree ===
- takeScreenshot: p234_01_workspace

- tapOn:
    text: "AGENTS.md"

- extendedWaitUntil:
    visible: ".*"
    timeout: 8000

- takeScreenshot: p234_02_file_opened

# === Phase 2: Markdown toggle (if visible) ===
- tapOn:
    text: ".*[Pp]review.*"
    optional: true

- waitForAnimationToEnd:
    timeout: 3000

- takeScreenshot: p234_03_md_toggled

# Back to workspace (viewer top bar Back has no resource-id; match text)
- tapOn:
    text: "Back"

- extendedWaitUntil:
    visible: "Refresh"
    timeout: 5000

# === Phase 4: Large file + scroll ===
- tapOn:
    text: "build.gradle.kts"
    index: 0

- extendedWaitUntil:
    visible: ".*"
    timeout: 5000

- takeScreenshot: p234_04_large_file_initial

- swipe:
    start: 50%, 80%
    end: 50%, 20%

- takeScreenshot: p234_05_large_file_scrolled

# Done — take final screenshot
- takeScreenshot: p234_06_complete
