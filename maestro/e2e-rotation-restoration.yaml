appId: dev.leonardo.ocbeacon.dev
name: E2E - Rotation Restoration
tags:
  - e2e
  - workspace
  - rotation
---

# Prerequisite: Server at 10.0.2.2:4096, session active, workspace accessible
# Validates Phase 4 rememberSaveable: scroll position survives screen rotation.
# Note: rotateDevice may behave differently across Android versions / emulators.
# Key assertions are marked optional: true so non-rotation failures don't block CI.

- launchApp

# Connect if not already connected (app does not auto-connect after cold start)
- tapOn:
    text: "Connect"
    optional: true

- extendedWaitUntil:
    visible: "Connected"
    timeout: 20000
    optional: true

# Navigate to a session
- tapOn:
    text: "Sessions"
    index: 0
- extendedWaitUntil:
    visible: "Search sessions..."
    timeout: 20000
    optional: true
- tapOn: "D:/Develop/code/app/oc-beacon"
- extendedWaitUntil:
    visible: "sessions active"
    timeout: 15000
    optional: true
- tapOn:
    text: ".*"
    index: 0
- extendedWaitUntil:
    visible: "Ask a question"
    timeout: 20000
    optional: true

# Open workspace
- tapOn:
    id: "more_vert"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "View Workspace"

# Open a specific file (tapOn ".*" may hit a non-file element)
- tapOn:
    text: "AGENTS.md"

# Verify file viewer opened (portrait)
- extendedWaitUntil:
    visible: ".*back_button.*"
    timeout: 5000
    optional: true
- takeScreenshot: e2e_rotation_portrait

# Scroll to middle of the file
- swipe:
    direction: UP
    duration: 800
- swipe:
    direction: UP
    duration: 800
- takeScreenshot: e2e_rotation_scrolled_position

# Rotate to landscape
- setOrientation: LANDSCAPE_LEFT
- extendedWaitUntil:
    visible: ".*back_button.*"
    timeout: 5000
    optional: true
- takeScreenshot: e2e_rotation_landscape

# Rotate back to portrait
- setOrientation: PORTRAIT
- takeScreenshot: e2e_rotation_back_to_portrait

# Verify scroll position roughly preserved (visual comparison of screenshots).
# No precise assertion — position need not be pixel-perfect, just "still in the file".

# Go back (viewer top bar Back has no resource-id; match text)
- tapOn:
    text: "Back"
