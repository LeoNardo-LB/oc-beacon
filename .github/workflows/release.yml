name: Build Release APK

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Flavor to build (beta/stable/dev)'
        required: true
        default: 'beta'
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Extract version from version.properties
        id: version
        run: bash scripts/ci-extract-version.sh "$GITHUB_OUTPUT"

      # 从 tag 或手动输入推导 flavor：
      #   v1.0.3         -> stable（无后缀）
      #   v1.0.4-beta    -> beta（每线单发、无序号）
      #   v1.0.4-dev.1   -> dev（线内迭代有序号）
      - name: Determine flavor from tag
        id: flavor
        run: bash scripts/ci-determine-flavor.sh "${{ github.event.inputs.flavor }}" "${{ github.ref }}" "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant execute permissions for gradlew
        run: chmod +x ./gradlew

      - name: i18n check (key completeness / English source purity / placeholder consistency)
        run: bash scripts/i18n-check.sh

      - name: Remove local-only settings
        run: bash scripts/ci-clean-local-settings.sh

      # #151 GitHub App 凭据注入：从 repo secrets 写入 local.properties（gitignored，
      # 不进 git 历史/产物文件）；secrets 未配置时跳过——构建照常（凭据空=上报禁用态）。
      # 注意：secret 仍会编译进 APK BuildConfig（公共客户端固有风险，spec 知情接受）。
      # secret 命名避开 GITHUB_ 前缀（GitHub 保留字，禁止创建）。
      - name: Write GitHub App credentials to local.properties
        env:
          GH_CLIENT_ID: ${{ secrets.APP_GITHUB_CLIENT_ID }}
          GH_CLIENT_SECRET: ${{ secrets.APP_GITHUB_CLIENT_SECRET }}
        if: ${{ env.GH_CLIENT_ID != '' && env.GH_CLIENT_SECRET != '' }}
        run: |
          printf 'GITHUB_APP_CLIENT_ID=%s\nGITHUB_APP_CLIENT_SECRET=%s\n' "$GH_CLIENT_ID" "$GH_CLIENT_SECRET" >> local.properties
          echo "credentials injected ($(wc -c < local.properties) bytes)"

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: bash scripts/ci-decode-keystore.sh

      # #106-6 工具链治理：Android Lint 门禁——存量问题由 app/lint-baseline.xml 豁免，
      # 新增 error 直接卡住发版（abortOnError=true）
      - name: Android Lint gate (baseline-tracked, new issues fail)
        run: ./gradlew :app:lint${{ steps.flavor.outputs.flavor }}Release

      - name: Build Release APK
        run: ./gradlew :app:assemble${{ steps.flavor.outputs.flavor }}Release

      - name: Rename APK
        run: bash scripts/ci-rename-apk.sh "${{ steps.version.outputs.name }}" "${{ steps.flavor.outputs.flavor }}"

      - name: Upload Release APK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ocbeacon-release-${{ steps.version.outputs.name }}
          path: release-apks/*.apk
          retention-days: 90

      # #153：R8 mapping.txt 留存（90 天）——用户上报的混淆堆栈事后可还原；
      # 与 APK 同批构建产物，release 构建开启 minify（app/build.gradle.kts）
      - name: Upload R8 mapping (deobfuscation)
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ocbeacon-mapping-${{ steps.version.outputs.name }}
          path: app/build/outputs/mapping/${{ steps.flavor.outputs.flavor }}Release/mapping.txt
          retention-days: 90
          if-no-files-found: error

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-release.sh "${{ steps.version.outputs.name }}" "${{ steps.flavor.outputs.flavor }}"
