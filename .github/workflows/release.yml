name: Build Release APK

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Flavor to build (beta/stable/dev)'
        required: true
        default: 'beta'
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Extract version from version.properties
        id: version
        run: |
          VERSION=$(grep 'VERSION_NAME=' version.properties | cut -d'=' -f2)
          VERSION_CODE=$(grep 'VERSION_CODE=' version.properties | cut -d'=' -f2)
          echo "name=$VERSION" >> $GITHUB_OUTPUT
          echo "code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION (code: $VERSION_CODE)"

      # 从 tag 或手动输入推导 flavor：
      #   v1.0.3         -> stable（无后缀）
      #   v1.0.4-beta.1  -> beta
      #   v1.0.4-dev.1   -> dev
      - name: Determine flavor from tag
        id: flavor
        run: |
          if [ -n "${{ github.event.inputs.flavor }}" ]; then
            FLAVOR="${{ github.event.inputs.flavor }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            if [[ "$TAG" == *"-beta."* ]]; then FLAVOR="beta"
            elif [[ "$TAG" == *"-dev."* ]]; then FLAVOR="dev"
            else FLAVOR="stable"; fi
          else
            FLAVOR="beta"
          fi
          echo "flavor=$FLAVOR" >> $GITHUB_OUTPUT
          echo "Flavor: $FLAVOR"

      - name: Set up JDK 21
        uses: actions/setup-java@v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant execute permissions for gradlew
        run: chmod +x ./gradlew

      - name: i18n check (key completeness / English source purity / placeholder consistency)
        run: pwsh scripts/i18n-check.ps1

      - name: Remove local-only settings
        run: |
          sed -i '/^systemProp\./d' gradle.properties
          sed -i '/^org.gradle.java.home/d' gradle.properties

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          mkdir -p app/keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/keystore/release.keystore
          echo "keystore=keystore/release.keystore" > app/keystore/signing.properties
          echo "keystore.alias=${{ secrets.KEYSTORE_ALIAS }}" >> app/keystore/signing.properties
          echo "keystore.password=${{ secrets.KEYSTORE_PASSWORD }}" >> app/keystore/signing.properties

      - name: Build Release APK
        run: ./gradlew :app:assemble${{ steps.flavor.outputs.flavor }}Release

      - name: Rename APK
        run: |
          VERSION="${{ steps.version.outputs.name }}"
          FLAVOR="${{ steps.flavor.outputs.flavor }}"
          mkdir -p release-apks
          # Find the built APK (signed or unsigned)
          APK=$(find app/build/outputs/apk/${FLAVOR}/release -name '*.apk' | head -1)
          if [ -n "$APK" ]; then
            cp "$APK" release-apks/oc-beacon-${VERSION}.apk
          else
            echo "::error::No APK found in app/build/outputs/apk/${FLAVOR}/release/"
            exit 1
          fi

      - name: Upload Release APK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ocbeacon-release-${{ steps.version.outputs.name }}
          path: release-apks/*.apk
          retention-days: 90

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.name }}"
          FLAVOR="${{ steps.flavor.outputs.flavor }}"
          TAG="v${VERSION}"

          # Create tag if it doesn't exist
          git tag $TAG || true
          git push origin $TAG || true

          # 预发布标记：beta/dev 为 prerelease，stable 为正式版
          PRERELEASE_FLAG=""
          if [ "$FLAVOR" != "stable" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          # Check if release already exists
          if gh release view $TAG > /dev/null 2>&1; then
            echo "Release $TAG already exists, uploading APK..."
            gh release upload $TAG release-apks/*.apk --clobber
          else
            echo "Creating new release $TAG..."
            gh release create $TAG \
              --title "OC Beacon ${VERSION}" \
              $PRERELEASE_FLAG \
              --generate-notes \
              release-apks/*.apk
          fi
