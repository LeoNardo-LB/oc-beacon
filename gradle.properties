# 项目级 Gradle 设置
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# 在 Windows 上禁用 daemon —— 修复 BUILD SUCCESSFUL 后偶发的进程管道挂起。
# Windows 上的 Gradle daemon 有时会保持 stdout/stderr 管道不关闭，导致
# 进程执行器（OpenCode bash 工具、CI 执行器）无限等待。
# 参考：https://github.com/gradle/gradle/issues/12560（Windows daemon 管道挂起）
org.gradle.daemon=false

# Android 设置
android.useAndroidX=true
android.enableJetifier=true

# Kotlin 设置
kotlin.code.style=official

# JDK 路径（Scoop 管理的 Temurin 21）
org.gradle.java.home=D:\\Develop\\Scoop\\apps\\temurin21-jdk\\current

# 代理设置
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7897
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7897
