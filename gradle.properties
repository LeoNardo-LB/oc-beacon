# 项目级 Gradle 设置
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Gradle Daemon：默认不设置（Linux/macOS 下 daemon 正常工作，可提升构建速度）。
# 历史背景：Windows 上曾遇 Gradle daemon 管道挂起问题（BUILD SUCCESSFUL 后进程不返回，
# 见 https://github.com/gradle/gradle/issues/12560），当时用 org.gradle.daemon=false 规避。
# 如你在 Windows 上遇到同样问题，取消下一行注释：
# org.gradle.daemon=false

# Android 设置
android.useAndroidX=true

# Kotlin 设置
kotlin.code.style=official

# JDK 路径：默认使用 JAVA_HOME / PATH 中的 JDK（本项目需要 JDK 21）。
# 如需显式指定，取消注释并改为你本机路径：
#   Linux:
#     org.gradle.java.home=/usr/lib/jvm/temurin-21-jdk-amd64
#   Windows（Scoop 管理示例）:
#     org.gradle.java.home=D:\Develop\Scoop\apps\temurin21-jdk\current

# 代理设置（如网络环境需要代理下载依赖，取消注释并修改）：
# systemProp.http.proxyHost=127.0.0.1
# systemProp.http.proxyPort=7897
# systemProp.https.proxyHost=127.0.0.1
# systemProp.https.proxyPort=7897

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
