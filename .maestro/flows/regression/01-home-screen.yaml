appId: dev.leonardo.ocremoteplus
name: "回归: 主屏幕和服务器卡片"
tags: [regression, color-cleanup]
---
- launchApp:
    clearState: false
- waitForAnimationToEnd
- takeScreenshot: /tmp/maestro-screenshots/01-home-screen  # Windows: C:\Users\ADMINI~1\AppData\Local\Temp\maestro-screenshots\01-home-screen
- scroll
- waitForAnimationToEnd
- takeScreenshot: /tmp/maestro-screenshots/02-home-scrolled  # Windows: C:\Users\ADMINI~1\AppData\Local\Temp\maestro-screenshots\02-home-scrolled
