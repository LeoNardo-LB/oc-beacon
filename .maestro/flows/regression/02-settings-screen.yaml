appId: dev.leonardo.ocremoteplus
name: "回归: 设置页面 (Switch颜色)"
tags: [regression, color-cleanup]
---
- launchApp:
    clearState: false
- waitForAnimationToEnd
# Navigate to settings - tap the settings navigation item
- tapOn: "Settings"
- waitForAnimationToEnd
- takeScreenshot: /tmp/maestro-screenshots/03-settings-screen  # Windows: C:\Users\ADMINI~1\AppData\Local\Temp\maestro-screenshots\03-settings-screen
- scroll
- waitForAnimationToEnd
- takeScreenshot: /tmp/maestro-screenshots/04-settings-scrolled  # Windows: C:\Users\ADMINI~1\AppData\Local\Temp\maestro-screenshots\04-settings-scrolled
