  responses:
    TransportBadRequest:
      description: >-
        Carrier layer: request body is not JSON (plain-text body "body is not JSON"). Business bad-request
        stays HTTP 200. Source: fetch/handler.js:212-219.
    TransportNotFound:
      description: >-
        Carrier layer: unknown method/path ("not found"). GET on a POST-only route also lands here. Source:
        fetch/handler.js:199-201,226-228.
    TransportUnsupportedMediaType:
      description: >-
        Carrier layer: Content-Type is not application/json ("content type must be application/json") — the
        cross-site write fence. Source: fetch/handler.js:202-211.
    TransportForbidden:
      description: >-
        Trust fence: Host header not loopback/trustedHosts, or a privileged method from a non-loopback Host,
        or mismatched Origin/Sec-Fetch-Site markers ("forbidden"). Source:
        dsh-client-connection/lib/index.js:184-198,538,553-560.
    TransportPayloadTooLarge:
      description: >-
        Request body exceeds maxRequestBodyBytes (default 300 MiB). Connection closed. Source:
        dsh-client-connection/lib/index.js:29,44-60.
    TransportInternal:
      description: "Carrier layer: handler crash (\"handler failure: …\"). Source: fetch/handler.js:114-117."
