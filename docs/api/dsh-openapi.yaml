          description: "Surface events only: chunk seqs folded into this message."
        surfaceOp:
          description: "Surface events only: \"append\" or {op:\"replace\",start,end}."
        ignorable:
          type: boolean
          enum:
            - true
          description: Unknown-type events carrying this may be skipped on rebuild.
