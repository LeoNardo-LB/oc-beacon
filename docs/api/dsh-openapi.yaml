        Carrier receipt for POST /api/respond (not an RpcMessage). Late/duplicate answers yield not-pending;
        malformed ones bad-response. Source: dsh-host-apiproxy/lib/types/api/rpc.d.ts:250-261;
        fetch/handler.js:220-225.
