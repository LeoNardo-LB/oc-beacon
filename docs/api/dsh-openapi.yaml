    ClientRequest:
      type: object
      description: >-
        Quadrant 1: client-initiated request. Wire carrier: POST /api/<method> body; body.method MUST equal
        the URL path segment. Source: dsh-host-apiproxy/lib/types/api/rpc.d.ts:218-224.
      required:
        - type
        - rpcId
        - method
        - payload
      properties:
        type:
          type: string
          enum:
            - client-request
        rpcId:
          $ref: "#/components/schemas/RpcId"
        method:
          type: string
        payload:
          description: Business payload; validated per-method (second-level parse). null fails as bad-request.
    ServerResponse:
      type: object
      description: >-
        Quadrant 2: response to a ClientRequest; rpcId echoed. Business errors ride HTTP 200 here. Source:
        dsh-host-apiproxy/lib/types/api/rpc.d.ts:225-230.
      required:
        - type
        - rpcId
        - result
      properties:
        type:
          type: string
          enum:
            - server-response
        rpcId:
          $ref: "#/components/schemas/RpcId"
        result:
          $ref: "#/components/schemas/RpcResult"
    ServerRequest:
      type: object
      description: >-
        Quadrant 3: server-initiated message. Wire carrier: one WS text frame on the downlinks (method =
        payload.type). rpcId is stable for answerable frames (approval/question requested), fresh per push
        otherwise. Source: dsh-host-apiproxy/lib/types/api/rpc.d.ts:231-242.
      required:
        - type
        - rpcId
        - method
        - payload
      properties:
        type:
          type: string
          enum:
            - server-request
        rpcId:
          $ref: "#/components/schemas/RpcId"
        method:
          type: string
        payload: {}
    ClientResponse:
      type: object
      description: >-
        Quadrant 4: response to a ServerRequest; rpcId echoes the pending server request. Wire carrier: POST
        /api/respond. Source: dsh-host-apiproxy/lib/types/api/rpc.d.ts:243-248.
      required:
        - type
        - rpcId
        - result
      properties:
        type:
          type: string
          enum:
            - client-response
        rpcId:
          $ref: "#/components/schemas/RpcId"
        result:
          $ref: "#/components/schemas/RpcResult"
    RpcResult:
      oneOf:
        - type: object
          required:
            - ok
            - value
          properties:
            ok:
              type: boolean
              enum:
                - true
            value: {}
        - type: object
          required:
            - ok
            - error
          properties:
            ok:
              type: boolean
              enum:
                - false
            error:
              $ref: "#/components/schemas/RpcError"
      description: >-
        Business result slot: ok true carries value, ok false carries error. Methods never throw business
        errors. Source: dsh-host-apiproxy/lib/types/api/rpc.d.ts:188-195.
