  /api/respond:
    post:
      tags:
        - transport
      operationId: respond
      summary: Answer a pending server request (approval/question)
      description: >-
        Quadrant-4 entry: posts a client-response envelope whose rpcId echoes the pending server request
        (approval/requested or question/requested). result.value is routed by rpcId — ApprovalResponsePayload
        for approvals (the audit approvalId must match), QuestionResponsePayload for questions. Replies with a
        carrier RpcReceipt: {accepted:true} or {accepted:false, reason:not-pending|bad-response}. Evidence:
        E11 (not-pending), E11b (bad-response). Source: dsh-host-apiproxy/lib/types/api/rpc.d.ts:243-261;
        fetch/handler.js:220-225; api-proxy.js:3309-3321.
      x-dsh-kind: mutation
      requestBody:
        required: true
        content:
          application/json:
            schema:
