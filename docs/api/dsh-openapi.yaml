  /api/llm.discoverModels:
    post:
      tags:
        - llm
      operationId: llm.discoverModels
      summary: Interrogate a draft provider endpoint for models
      description: >-
        PRIVILEGED (loopback-pinned): carries a draft credential and makes the HOST issue a GET to a
        caller-chosen URL. Nothing is written. Error path tested: unreachable/unregistered ->
        model-discovery-failed (evidence E18); the success path was not exercised (would call an external
        endpoint). Source: llm.d.ts:52-75. Payload/value schemas: dsh-host-apiproxy/lib/types/api/ (d.ts +
        .schema.js).
      x-dsh-kind: mutation
      x-dsh-privileged: true
      x-dsh-cancellable: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ClientRequest"
                - type: object
                  properties:
                    method:
                      type: string
                      enum:
                        - llm.discoverModels
                    payload:
                      $ref: "#/components/schemas/llm.discoverModels.Request"
            example:
              type: client-request
              rpcId: 0b6f7b1a-0000-4000-8000-000000000001
              method: llm.discoverModels
              payload:
                settingsNs: llm-deepseek
                baseURL: https://example.invalid/v1
      responses:
        "200":
          description: >-
            Envelope delivered. The business result rides result: ok=true carries the value; ok=false carries
            an RpcError (39-code closed set). HTTP status stays 200 for ALL business errors.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ServerResponse"
                  - type: object
                    properties:
                      result:
                        oneOf:
                          - type: object
                            required:
                              - ok
                              - value
                            properties:
                              ok:
                                type: boolean
                                enum:
                                  - true
                              value:
                                $ref: "#/components/schemas/llm.discoverModels.Value"
                          - type: object
                            required:
                              - ok
                              - error
                            properties:
                              ok:
                                type: boolean
                                enum:
                                  - false
                              error:
                                $ref: "#/components/schemas/RpcError"
        "400":
          $ref: "#/components/responses/TransportBadRequest"
        "403":
          $ref: "#/components/responses/TransportForbidden"
        "404":
          $ref: "#/components/responses/TransportNotFound"
        "413":
          $ref: "#/components/responses/TransportPayloadTooLarge"
        "415":
