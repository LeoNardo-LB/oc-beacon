  /api/session.export:
    get:
      tags:
        - transport
      operationId: session.export
      summary: Download one session-log ZIP (no envelope)
      description: >-
        GET download channel: streams the root session artifact verbatim plus each subagent descendant under
        subagents/<id>/ (includeDescendants, default off; observed: a fork child counts as a descendant).
        Headers: content-type application/zip, content-disposition attachment;
        filename="dsh-session-<sessionId>.zip". The /api Host fence still applies. Evidence: X1 (64KB zip, 2
        entries incl. the fork child) + X2 (HEAD). Source:
        dsh-host-apiproxy/lib/types/api/downloads.d.ts:9-22; downloads.schema.js:15-23;
        api-proxy.js:3269-3306.
      parameters:
        - name: sessionId
          in: query
          required: true
          schema:
            type: string
            minLength: 1
          description: Root session id.
        - name: includeDescendants
          in: query
          required: false
          schema:
            type: string
            enum:
              - "true"
              - "false"
          description: >-
            Exactly "true"/"false"/absent — anything else is a 400 (a misspelled flag must not silently
            under-export).
      responses:
        "200":
          description: ZIP stream.
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "400":
          description: Missing or invalid sessionId / includeDescendants query parameter (plain-text body).
        "403":
          $ref: "#/components/responses/TransportForbidden"
        "404":
          description: Root session has no stored artifact ("session not found").
        "500":
          description: Missing export services, or the stored artifact failed to prepare (no error details echoed).
        "501":
          description: Persistence backend does not expose raw artifacts.
    head:
      tags:
        - transport
      operationId: session.export.head
      summary: HEAD variant of the export channel
      description: "Same route/params; answers status + headers without the body. Source: fetch/handler.js:186-198."
      parameters:
        - name: sessionId
          in: query
          required: true
          schema:
            type: string
            minLength: 1
          description: Root session id.
        - name: includeDescendants
          in: query
          required: false
          schema:
            type: string
            enum:
              - "true"
              - "false"
          description: >-
            Exactly "true"/"false"/absent — anything else is a 400 (a misspelled flag must not silently
            under-export).
      responses:
        "200":
          description: Headers only (content-type/content-disposition).
        "400":
          description: Invalid query.
        "404":
          description: Unknown session.
  /api/events.mux:
    get:
      tags:
        - transport
      operationId: events_mux.get
      summary: All-session mux event stream (WS downlink; GET -> 426)
      description: >-
        On open: one session/subscribed baseline per attached session (observed 11), then live session/event /
        session/projection / session/queue / session/jobs frames interleaved across sessions, strictly
        seq-ordered per session. Still-pending approval/question frames replay with a stable rpcId. The 426
        response is what a plain HTTP GET receives under the dsh-web composition (client-connection intercepts
        the apiproxy SSE variant; evidence E12a/E12b). WS behavior verified live (ws-probe.cjs): RFC6455 v13
        only, no subprotocol, no permessage-deflate, no heartbeat/idle timeout, downlink-only. Source:
        dsh-client-connection/lib/index.js:334-465,539-545,563-585.
      responses:
        "403":
          $ref: "#/components/responses/TransportForbidden"
        "426":
          description: >-
            Upgrade Required — this route is a WebSocket downlink under the web composition (headers:
            Connection: Upgrade, Upgrade: websocket).
          headers:
            Connection:
              schema:
                type: string
                enum:
                  - Upgrade
            Upgrade:
              schema:
                type: string
                enum:
                  - websocket
      x-websocket:
        summary: WebSocket downlink (server-to-client text frames only)
        upgrade: websocket (RFC6455 v13; no subprotocol, no compression)
        direction: server-to-client only — a client data frame is a protocol violation closed with 1008 "downlink only"
        handshake: >-
          Same trust fence as /api POST: Host must be loopback/trustedHosts; Origin (when present) must match
          Host host:port; a bad Host gets a raw HTTP 403 "forbidden" before upgrade
        heartbeat: none (no server pings, no idle timeout — clients should send protocol PINGs and own reconnect)
        reconnect: >-
          No replay/since cursor: reopening emits fresh baselines (mux: session/subscribed per attached
          session; host: none) and clients re-baseline via HTTP RPC (session.list/history, workspace.list);
          the official client backs off 500ms*2^n capped at 10s
        frames:
          $ref: "#/components/schemas/MuxStreamFrame"
        answerTransport: answerable frames (approval/question requested) are answered over HTTP POST /api/respond
  /api/events.host:
    get:
      tags:
        - transport
      operationId: events_host.get
      summary: Host-level event stream (WS downlink; GET -> 426)
      description: >-
        Host-level create/destroy/running flips, agent errors, workspace snapshots, archive-set pushes,
        allowlisted remote events. No snapshot baseline on open (observed: 0 frames while idle) — re-baseline
        via HTTP RPC. The 426 response is what a plain HTTP GET receives under the dsh-web composition
        (client-connection intercepts the apiproxy SSE variant; evidence E12a/E12b). WS behavior verified live
        (ws-probe.cjs): RFC6455 v13 only, no subprotocol, no permessage-deflate, no heartbeat/idle timeout,
        downlink-only. Source: dsh-client-connection/lib/index.js:334-465,539-545,563-585.
      responses:
        "403":
          $ref: "#/components/responses/TransportForbidden"
        "426":
          description: >-
            Upgrade Required — this route is a WebSocket downlink under the web composition (headers:
            Connection: Upgrade, Upgrade: websocket).
          headers:
            Connection:
              schema:
                type: string
                enum:
                  - Upgrade
            Upgrade:
              schema:
                type: string
                enum:
                  - websocket
      x-websocket:
        summary: WebSocket downlink (server-to-client text frames only)
        upgrade: websocket (RFC6455 v13; no subprotocol, no compression)
        direction: server-to-client only — a client data frame is a protocol violation closed with 1008 "downlink only"
        handshake: >-
          Same trust fence as /api POST: Host must be loopback/trustedHosts; Origin (when present) must match
          Host host:port; a bad Host gets a raw HTTP 403 "forbidden" before upgrade
        heartbeat: none (no server pings, no idle timeout — clients should send protocol PINGs and own reconnect)
        reconnect: >-
          No replay/since cursor: reopening emits fresh baselines (mux: session/subscribed per attached
          session; host: none) and clients re-baseline via HTTP RPC (session.list/history, workspace.list);
          the official client backs off 500ms*2^n capped at 10s
        frames:
          $ref: "#/components/schemas/HostStreamFrame"
        answerTransport: answerable frames (approval/question requested) are answered over HTTP POST /api/respond
components:
  schemas:
    RpcId:
      type: string
      description: >-
        Correlation id minted by the initiator and echoed verbatim by the responder. Opaque echo token; no
        min-length (rpcIdSchema, rpc.schema.js:14). Source: dsh-host-apiproxy/lib/types/api/rpc.d.ts:16-24.
    ZodIssue:
      type: object
      description: >-
        One zod validation issue, verbatim from the schema library (shape is zod-version-dependent; treat as
        open).
      properties:
        code:
          type: string
          description: Issue kind, e.g. invalid_type, invalid_format, too_small.
        path:
          type: array
          items: {}
        message:
          type: string
        expected: {}
        received: {}
      additionalProperties: true
    RpcError:
      oneOf:
        - $ref: "#/components/schemas/RpcError.bad-request"
        - $ref: "#/components/schemas/RpcError.cancelled"
        - $ref: "#/components/schemas/RpcError.session-not-found"
