  /api/session.prompt:
    post:
      tags:
        - session
      operationId: session.prompt
      summary: Send a prompt (queue or steer)
      description: >-
        Side effect: durable admission then an agent turn. content is browser-narrow (text/image parts);
        exactly-one-text-block starting with "/" dispatches a slash command instead of a model call (command
        slot, or command-error/unknown-command). Subagents reject agent-busy (use subagent.prompt). Evidence:
        M05 (accepted:true). Source: sessions.d.ts:362-380. Payload/value schemas:
        dsh-host-apiproxy/lib/types/api/ (d.ts + .schema.js).
      x-dsh-kind: mutation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
