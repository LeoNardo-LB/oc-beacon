openapi: 3.0.3
info:
  title: DSH (DeepSeek Harness) Web API
  version: 0.1.1-rc.2
  description: >-
    Wire contract of the DSH web host (dsh web, default http://127.0.0.1:3080), transcribed from the shipped
    0.1.1-rc.2 type definitions and verified against a live instance (2026-08-31; evidence under
    /tmp/dsh-openapi-cases/ — see INDEX.md).


    **NOT JSON-RPC.** Every method is POST /api/<method> with a four-quadrant envelope body:
    {"type":"client-request","rpcId":"<any string>","method":"<method>","payload":{…}}. body.method MUST equal
    the URL path segment. The response is a server-response envelope echoing rpcId; the business result rides
    result.{ok,value|error}.


    **HTTP status describes only the carrier.** Business errors are ALWAYS HTTP 200 with result.ok=false and a
    closed 39-value error.code set (components.schemas.RpcError). Carrier-layer statuses: 404 unknown
    path/method - 415 non-JSON Content-Type - 400 non-JSON body - 403 trust fence - 413 body cap - 426 WS-only
    route - 500 handler crash.


    **No authentication layer.** Four fences instead (dsh-client-connection/lib/index.js):

    1. Webserver bind (deployment config; CLI default 127.0.0.1, this instance 0.0.0.0 with derived LAN
    trust).

    2. Host-header fence on every /api request: Host must be loopback (localhost, [::1], 127/8 —
    port-insensitive) or a trustedHosts entry / derived LAN IP; plus Sec-Fetch-Site must not be cross-site,
    and Origin (when present) must match the Host host:port.

    3. Privileged-plane pin: 15 methods (x-dsh-privileged: true) re-check the fence with an EMPTY trust list —
    loopback Host only, even on trusted-host deployments.

    4. WebSocket upgrades run the same fence before negotiation; failures get a raw 403.

    This is a DNS-rebinding defense, explicitly not auth: any process that can write Host: 127.0.0.1:3080
    passes everything.


    **Request bodies** are capped at maxRequestBodyBytes (default 300 MiB, buffered in memory). Extra JSON
    fields are ignored by validation (zod); payload:null fails as bad-request.


    **Event streams** are WebSocket downlinks (/api/events.mux, /api/events.host — plain GET answers 426): one
    JSON ServerRequest envelope per text frame, method = payload.type, rpcId fresh per push (stable for
    answerable approval/question frames, answered over POST /api/respond). **/api/session.export** is a GET
    zip download outside the envelope.


    Known cross-cutting pitfalls: host.describe.version is a hardcoded "0.0.1" (never the package version);
    session timestamps are epoch-ms while workspace timestamps are ISO-8601; skill.list needs an attached
    session; session.models on subagent-origin sessions answers agent-busy; session.search may be
    deployment-disabled (internal).
servers:
  - url: http://127.0.0.1:3080
    description: Local DSH web host (loopback Host header required; hosts the GUI instance this spec was probed against).
tags:
  - name: session
    description: "Ordinary session surface (12 methods). Source: dsh-host-apiproxy/lib/types/api/sessions.d.ts."
  - name: subagent
    description: >-
      Session-backed child catalog/delivery (4 methods). Source:
      dsh-host-apiproxy/lib/types/api/subagents.d.ts.
  - name: host
    description: "Host machine surface (5 methods). Source: dsh-host-apiproxy/lib/types/api/host.d.ts."
  - name: workspace
    description: "Workspace registry (7 methods). Source: dsh-host-apiproxy/lib/types/api/workspace.d.ts."
  - name: skill
    description: "Skill catalog (1 method). Source: dsh-host-apiproxy/lib/types/api/skills.d.ts."
  - name: agentPreset
    description: >-
      Agent composition roster + authoring (6 methods). Source:
      dsh-host-apiproxy/lib/types/api/agent-presets.d.ts.
  - name: goal
    description: >-
      Goal mutations (6 methods; the read side is the goal projection). Source:
      dsh-host-apiproxy/lib/types/api/goals.d.ts.
  - name: settings
    description: "User-settings seam web face (5 methods). Source: dsh-host-apiproxy/lib/types/api/settings.d.ts."
  - name: credentials
    description: "Credential-reference seam (3 methods). Source: dsh-host-apiproxy/lib/types/api/credentials.d.ts."
  - name: llm
    description: "Provider/model topology (3 methods). Source: dsh-host-apiproxy/lib/types/api/llm.d.ts."
  - name: transport
    description: "Non-envelope entries: respond, session.export, events.mux, events.host."
paths:
  /api/session.list:
    post:
      tags:
        - session
      operationId: session.list
      summary: List persisted sessions
      description: >-
        Full session list, updatedAt descending. cursor is a reserved seat (accepted, ignored). Timestamps are
        epoch ms (contrast workspace domain ISO-8601). Evidence: 01-session.list (382 items, 13 projection
        keys). Source: sessions.d.ts:231-236. Payload/value schemas: dsh-host-apiproxy/lib/types/api/ (d.ts +
        .schema.js).
      x-dsh-kind: read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ClientRequest"
                - type: object
                  properties:
                    method:
                      type: string
                      enum:
                        - session.list
                    payload:
                      $ref: "#/components/schemas/session.list.Request"
            example:
              type: client-request
              rpcId: 0b6f7b1a-0000-4000-8000-000000000001
              method: session.list
              payload:
                cursor: optional-reserved
      responses:
        "200":
          description: >-
            Envelope delivered. The business result rides result: ok=true carries the value; ok=false carries
            an RpcError (39-code closed set). HTTP status stays 200 for ALL business errors.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ServerResponse"
                  - type: object
                    properties:
                      result:
                        oneOf:
                          - type: object
                            required:
                              - ok
                              - value
                            properties:
                              ok:
                                type: boolean
                                enum:
                                  - true
                              value:
                                $ref: "#/components/schemas/session.list.Value"
                          - type: object
                            required:
                              - ok
                              - error
                            properties:
                              ok:
                                type: boolean
                                enum:
                                  - false
                              error:
                                $ref: "#/components/schemas/RpcError"
        "400":
          $ref: "#/components/responses/TransportBadRequest"
        "403":
          $ref: "#/components/responses/TransportForbidden"
        "404":
          $ref: "#/components/responses/TransportNotFound"
        "413":
          $ref: "#/components/responses/TransportPayloadTooLarge"
        "415":
          $ref: "#/components/responses/TransportUnsupportedMediaType"
        "500":
          $ref: "#/components/responses/TransportInternal"
